# Publishes the site to GitHub Pages (rnr4zor.github.io/CouchBandit) on every change to main.
# Copies public/ to the gh-pages branch but keeps the live rooms.json, because room edits made
# on the site save straight to gh-pages.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - name: Copy site files (keep live rooms)
        run: |
          rsync -a --delete --exclude .git --exclude rooms.json --exclude .nojekyll src/public/ site/
          touch site/.nojekyll
          [ -f site/rooms.json ] || cp src/public/rooms.json site/rooms.json
      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Live site already up to date."; exit 0; fi
          git commit -m "Deploy from main ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull --rebase -q origin gh-pages && git push origin gh-pages && exit 0; sleep 5; done
          exit 1
