# Every 3 hours: finds scheduled live streams on the official channels in tools/channels.json
# and adds/updates them as categorised event rooms on Couch Bandit (max 5 backups each).
#
# Uses the OWNER_PASS secret you already have. Optional secrets:
#   YT_API_KEY  free YouTube Data API key (more reliable than reading the public pages)
#   SITE_URL    defaults to https://couchbandit.pages.dev
name: Event sync
on:
  schedule: [{ cron: "17 */3 * * *" }]
  workflow_dispatch:
concurrency: { group: event-sync, cancel-in-progress: true }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Find and post events
        env:
          SITE: ${{ secrets.SITE_URL || 'https://couchbandit.pages.dev' }}
          SYNC_KEY: ${{ secrets.OWNER_PASS }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node tools/events-sync.mjs
